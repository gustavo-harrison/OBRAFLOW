{% extends 'base.html' %}

{% block title %}Recuperar contraseña{% endblock %}

{% block content %}

<div class="container mt-5" style="max-width: 520px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">

            <h3 class="fw-bold mb-3">Recuperar contraseña</h3>

            <p class="text-muted">
                Ingresa el correo asociado a tu cuenta. Te enviaremos un enlace para crear una nueva contraseña.
            </p>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Correo electrónico</label>
                    {{ form.email }}
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Enviar enlace
                </button>
            </form>

            <div class="mt-3 text-center">
                <a href="{% url 'login' %}">Volver al inicio de sesión</a>
            </div>

        </div>
    </div>
</div>

{% endblock %}
